[build]
  command = "npm run build && npx esbuild netlify/functions/game.mts --bundle --platform=node --format=esm --outfile=netlify/functions/game.mjs --external:@netlify/blobs"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev --workspace @curio/web"
  targetPort = 5173
  # Pinned, because an unpinned `netlify dev` picks a free port at random —
  # which is fine until you are pointing a tunnel at it.
  port = 8888
  autoLaunch = false

# SPA fallback: every non-function path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
