[build]
  command = "npm run build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# SPA fallback: every non-function path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
