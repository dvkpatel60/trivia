<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candlelight — a wizarding trivia party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root{
  --ink:#0d0918;
  --ink-2:#140e24;
  --panel:#191230;
  --panel-2:#1f1739;
  --edge:#2e2450;
  --edge-soft:#241b42;

  --candle:#e8b55c;      /* brass / flame gold  */
  --candle-dim:#8a6b34;
  --ember:#c2543a;       /* warning / wrong     */
  --moss:#3f9c7d;        /* correct             */
  --iris:#8878d6;        /* accent / links      */
  --parchment:#ece2cf;
  --parchment-dim:#a498b4;

  --r-lg:18px; --r-md:12px; --r-sm:8px;

  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}
/* night sky */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, #2a1c4d 0%, rgba(42,28,77,0) 55%),
    radial-gradient(90% 60% at 10% 100%, #1a2b3d 0%, rgba(26,43,61,0) 60%),
    var(--ink);
}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.75}
.star{position:absolute;background:var(--parchment);border-radius:50%;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}

#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:18px 16px 40px}

/* ───────────────────────── type ───────────────────────── */
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em;line-height:1.12}
h1{font-size:2.7rem}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--candle-dim)}
.serif-i{font-family:var(--display);font-style:italic;font-size:1.1rem;color:var(--parchment-dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ───────────────────────── chrome ───────────────────────── */
.card{
  background:linear-gradient(180deg,var(--panel) 0%,var(--ink-2) 100%);
  border:1px solid var(--edge);
  border-radius:var(--r-lg);
  padding:20px 18px;
  box-shadow:0 18px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
}
.card + .card{margin-top:14px}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 16px;border-radius:var(--r-md);
  background:var(--candle);color:#241704;
  font-weight:650;font-size:1rem;letter-spacing:.01em;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.985);filter:brightness(1.08)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--parchment);border:1px solid var(--edge)}
.btn.quiet{background:var(--panel-2);color:var(--parchment-dim);border:1px solid var(--edge-soft);font-weight:500}

.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mt-l{margin-top:26px}
.center{text-align:center}
.muted{color:var(--parchment-dim)}
.tiny{font-size:.82rem}
hr.rule{border:0;border-top:1px solid var(--edge-soft);margin:18px 0}

/* ───────────────────────── setup ───────────────────────── */
.field{margin-top:18px}
.field > label{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--candle-dim);margin-bottom:8px}
.hint{font-size:.8rem;color:var(--parchment-dim);margin-top:6px;line-height:1.4}

.stepper{display:flex;align-items:center;background:var(--ink-2);border:1px solid var(--edge-soft);border-radius:var(--r-md);overflow:hidden}
.stepper button{width:52px;height:48px;font-size:1.3rem;color:var(--candle);flex:none}
.stepper button:active{background:var(--panel-2)}
.stepper .val{flex:1;text-align:center;font-family:var(--mono);font-size:1.05rem;font-weight:500}
.stepper .val small{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--parchment-dim);font-weight:400}

.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:var(--ink-2);border:1px solid var(--edge-soft);border-radius:var(--r-md);width:100%;text-align:left}
.toggle .t-title{font-size:.95rem}
.toggle .t-sub{font-size:.76rem;color:var(--parchment-dim);margin-top:2px}
.switch{flex:none;width:46px;height:27px;border-radius:14px;background:#2a2148;position:relative;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--parchment-dim);transition:transform .18s,background .18s}
.toggle[aria-pressed="true"] .switch{background:var(--candle)}
.toggle[aria-pressed="true"] .switch::after{transform:translateX(19px);background:#241704}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-chip{display:flex;align-items:center;gap:9px;padding:11px 10px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft);text-align:left;transition:border-color .15s,background .15s}
.type-chip[aria-pressed="true"]{border-color:var(--candle);background:rgba(232,181,92,.09)}
.type-chip svg{flex:none;width:22px;height:22px;color:var(--parchment-dim)}
.type-chip[aria-pressed="true"] svg{color:var(--candle)}
.type-chip .tn{font-size:.86rem;line-height:1.2}
.type-chip .td{font-size:.68rem;color:var(--parchment-dim);margin-top:2px}

.player-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--ink-2);border:1px solid var(--edge-soft);border-radius:var(--r-md)}
.pip{flex:none;width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor}
.player-row input{flex:1;background:none;border:0;outline:none;color:var(--parchment);font-size:1rem;font-family:var(--display);font-weight:600;min-width:0}
.player-row .rm{flex:none;width:30px;height:30px;color:var(--parchment-dim);font-size:1.1rem;border-radius:50%}
.player-row .rm:active{background:var(--panel-2)}

/* ───────────────────────── candle (signature) ───────────────────────── */
.candle-wrap{position:relative;width:46px;height:104px;flex:none}
.candle-wrap svg{display:block;width:100%;height:100%;overflow:visible}
.flame{transform-origin:50% 100%;animation:flicker 1.6s ease-in-out infinite}
@keyframes flicker{
  0%,100%{transform:scale(1,1) translateX(0);opacity:.95}
  22%{transform:scale(.92,1.07) translateX(-.6px);opacity:1}
  47%{transform:scale(1.05,.94) translateX(.7px);opacity:.86}
  71%{transform:scale(.96,1.03) translateX(-.3px);opacity:1}
}
.candle-wrap.urgent .flame{animation-duration:.5s}
.candle-wrap.out .flame{opacity:0;transition:opacity .3s}
.candle-wrap.out .smoke{opacity:1}
.smoke{opacity:0;transition:opacity .4s}
.glow{filter:blur(6px);opacity:.55}
.candle-wrap.out .glow{opacity:0;transition:opacity .4s}

/* ───────────────────────── play header ───────────────────────── */
.hud{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.hud .who{min-width:0}
.hud h2{margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .score{font-family:var(--mono);font-size:.85rem;color:var(--candle);margin-top:4px}
.progress-dots{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--edge)}
.dot.done{background:var(--candle-dim)}
.dot.now{background:var(--candle);box-shadow:0 0 8px var(--candle)}

.q-kind{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:rgba(136,120,214,.13);border:1px solid rgba(136,120,214,.3);color:var(--iris);font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
.q-kind svg{width:14px;height:14px}
.prompt{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.28;margin-top:14px}

/* answers */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft);text-align:left;font-size:1rem;line-height:1.35;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--parchment-dim)}
.opt.right{border-color:var(--moss);background:rgba(63,156,125,.14)}
.opt.right .k{background:var(--moss);color:#052018}
.opt.wrong{border-color:var(--ember);background:rgba(194,84,58,.14)}
.opt.wrong .k{background:var(--ember);color:#2a0d06}
.opt.dim{opacity:.4}
.opt.sel{border-color:var(--candle)}

.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.tf .opt{flex-direction:column;justify-content:center;text-align:center;padding:24px 12px;font-family:var(--display);font-size:1.5rem;font-weight:600}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.match-col{display:flex;flex-direction:column;gap:8px}
.mi{padding:12px 10px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft);text-align:left;font-size:.85rem;line-height:1.28;min-height:62px;display:flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.mi.sel{border-color:var(--candle);background:rgba(232,181,92,.1)}
.mi.paired{opacity:.95}
.mi .tag{flex:none;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;background:var(--panel-2);color:var(--parchment-dim)}
.mi.paired .tag{background:var(--iris);color:#0e0a1a}
.mi.right{border-color:var(--moss);background:rgba(63,156,125,.13)}
.mi.wrong{border-color:var(--ember);background:rgba(194,84,58,.13)}
.mi .spell{font-family:var(--display);font-size:1.02rem;font-weight:600;font-style:italic}

/* input */
.answer-input{width:100%;padding:15px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge);color:var(--parchment);font-family:var(--display);font-size:1.5rem;font-weight:600;text-align:center;letter-spacing:.1em;text-transform:uppercase;outline:none}
.answer-input:focus{border-color:var(--candle)}
.scramble{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}
.tile{width:38px;height:44px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--candle)}

/* clue ladder */
.clue{padding:14px;border-radius:var(--r-md);background:var(--ink-2);border-left:2px solid var(--iris);font-family:var(--display);font-size:1.15rem;font-style:italic;line-height:1.4;margin-top:9px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.clue .cn{font-family:var(--mono);font-style:normal;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--iris);display:block;margin-bottom:4px}
.worth{font-family:var(--mono);font-size:.74rem;color:var(--candle);letter-spacing:.08em}

/* sort / houses */
.houses{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.house{padding:16px 12px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft);text-align:center;font-family:var(--display);font-size:1.15rem;font-weight:600;transition:border-color .15s}
.house .hs{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--parchment-dim);margin-top:3px}
.house.right{border-color:var(--moss);background:rgba(63,156,125,.13)}
.house.wrong{border-color:var(--ember);background:rgba(194,84,58,.13)}

/* sequence */
.seq-pool{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.seq-item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft);text-align:left;font-size:.95rem;transition:opacity .15s,border-color .15s}
.seq-item .ord{flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--parchment-dim)}
.seq-item.picked{opacity:.45}
.seq-item.picked .ord{background:var(--candle);color:#241704}
.seq-item.right{border-color:var(--moss)}
.seq-item.wrong{border-color:var(--ember)}

/* verdict */
.verdict{margin-top:18px;padding:15px;border-radius:var(--r-md);border:1px solid var(--edge);background:var(--ink-2);animation:fade .3s ease}
.verdict.good{border-color:rgba(63,156,125,.5);background:rgba(63,156,125,.09)}
.verdict.bad{border-color:rgba(194,84,58,.45);background:rgba(194,84,58,.08)}
.verdict h3{font-size:1.2rem}
.verdict .pts{font-family:var(--mono);font-size:1.5rem;color:var(--candle)}
.breakdown{font-family:var(--mono);font-size:.74rem;color:var(--parchment-dim);margin-top:6px;line-height:1.6}

/* pass screen */
.pass{min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.pass .big{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1.05;margin-top:6px}

/* scoreboard */
.sb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft)}
.sb-row .rank{font-family:var(--mono);font-size:.8rem;color:var(--parchment-dim);width:20px;flex:none}
.sb-row .nm{flex:1;font-family:var(--display);font-size:1.2rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-row .pt{font-family:var(--mono);font-size:1.05rem;color:var(--candle)}
.sb-row.lead{border-color:var(--candle);background:rgba(232,181,92,.08)}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:26px 0 8px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;max-width:120px}
.pod .pname{font-family:var(--display);font-size:1.05rem;font-weight:600;text-align:center;line-height:1.15}
.pod .ppts{font-family:var(--mono);font-size:.8rem;color:var(--candle)}

/* ───────────────────────── async / lobby ───────────────────────── */
.code-plate{text-align:center;padding:22px 16px;border-radius:var(--r-lg);background:
  repeating-linear-gradient(135deg,rgba(232,181,92,.05) 0 8px,transparent 8px 16px),var(--ink-2);
  border:1px dashed var(--candle-dim)}
.code-plate .code{font-family:var(--display);font-size:2.4rem;font-weight:700;letter-spacing:.04em;color:var(--candle);line-height:1.05;word-break:break-word}
.code-plate .sub{font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--parchment-dim);margin-bottom:8px}

.roster{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip-p{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--ink-2);border:1px solid var(--edge-soft);font-size:.88rem}
.chip-p .crown{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--candle-dim)}

.wait-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft)}
.wait-row .nm{flex:1;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wait-row .st{font-family:var(--mono);font-size:.72rem;color:var(--parchment-dim)}
.wait-row.in{border-color:rgba(63,156,125,.45)}
.wait-row.in .st{color:var(--moss)}
.mini-bar{width:52px;height:4px;border-radius:3px;background:var(--edge);overflow:hidden;flex:none}
.mini-bar i{display:block;height:100%;background:var(--candle)}

.rev-q{padding:13px 0;border-bottom:1px solid var(--edge-soft)}
.rev-q:last-child{border-bottom:0}
.rev-q .qq{font-family:var(--display);font-size:1.05rem;line-height:1.3}
.rev-q .aa{font-size:.85rem;color:var(--moss);margin-top:5px;line-height:1.5}
.rev-q .yy{font-family:var(--mono);font-size:.72rem;margin-top:5px}
.rev-q .yy.hit{color:var(--candle)}
.rev-q .yy.miss{color:var(--ember)}

.house.sel{border-color:var(--candle);background:rgba(232,181,92,.1)}
.pill-live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--parchment-dim)}
.pill-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--moss);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--edge);color:var(--parchment);padding:11px 18px;border-radius:99px;font-size:.86rem;z-index:9;animation:fade .2s ease}
.mode-btn{display:flex;align-items:center;gap:13px;width:100%;padding:16px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--edge-soft);text-align:left;transition:border-color .15s}
.mode-btn:active{border-color:var(--candle)}
.mode-btn svg{width:24px;height:24px;flex:none;color:var(--candle)}
.mode-btn .mt2{font-family:var(--display);font-size:1.2rem;font-weight:600}
.mode-btn .ms{font-size:.78rem;color:var(--parchment-dim);margin-top:2px;line-height:1.35}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px;border-radius:6px}

/* ── splash screen ── */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;text-align:center;padding:24px;animation:splashIn .6s ease-out}
.splash .logo{font-family:var(--display);font-size:clamp(2.6rem,7vw,3.8rem);font-weight:700;color:var(--candle);letter-spacing:.02em;opacity:0;animation:fadeUp .8s .2s ease-out forwards}
.splash .candle-icon{font-size:3rem;opacity:0;animation:fadeUp .7s .1s ease-out forwards}
.splash .credit{font-family:var(--serif);font-size:.88rem;color:var(--parchment-dim);margin-top:10px;opacity:0;animation:fadeUp .7s .5s ease-out forwards}
.splash .dots{margin-top:28px;display:flex;gap:7px;opacity:0;animation:fadeUp .5s .7s ease-out forwards}
.splash .dots span{width:7px;height:7px;border-radius:50%;background:var(--candle);opacity:.35;animation:pulse 1.4s .8s ease-in-out infinite}
.splash .dots span:nth-child(2){animation-delay:.95s}
.splash .dots span:nth-child(3){animation-delay:1.1s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.88)}50%{opacity:1;transform:scale(1.1)}}
.splash-out{animation:splashOut .45s ease-in forwards}
@keyframes splashOut{to{opacity:0;transform:scale(.96);pointer-events:none}}

/* invite link plate */
.invite-plate{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:8px;word-break:break-all;font-family:var(--mono);font-size:.72rem;color:var(--parchment-dim);line-height:1.5}
.invite-plate .url{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invite-plate .url.expanded{white-space:normal;word-break:break-all}
</style>
</head>
<body>
<div id="sky"></div>

   ═══════════════════════════════════════════════════════════════ */
const GAME_URL="/.netlify/functions/game";
let LAST_ERR="";
let GAME=null;  // current server game state cache

async function gameAPI(op, body, ms=8000){
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;
  const t=ctl?setTimeout(()=>ctl.abort(),ms):null;
  try{
    const r=await fetch(GAME_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op,...body}),signal:ctl?ctl.signal:undefined});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){LAST_ERR=op+": "+String(e&&e.message||e);return {error:LAST_ERR};}
  finally{if(t)clearTimeout(t);}
}

function stopPoll(){if(pollId)clearInterval(pollId);pollId=null;pollFn=null;}
function poll(fn,ms){
  if(pollId)clearInterval(pollId);
  pollFn=fn;pollGap=ms||pollGap;
  if(typeof document!=="undefined"&&document.hidden)return;   // don't poll a backgrounded tab
  pollId=setInterval(fn,pollGap);
}
if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("visibilitychange",()=>{
    if(!pollFn)return;
    if(document.hidden){if(pollId)clearInterval(pollId);pollId=null;}
    else{const fn=pollFn;fn();poll(fn);}                       // catch up immediately on return
  });
}

function startGame(){
  const chosen=Object.keys(TYPES).filter(k=>cfg.types[k]);
  const err=document.getElementById("err");
  if(!chosen.length){if(err)err.textContent="Choose at least one puzzle type.";return;}
  cfg.players.forEach((p,i)=>{if(!p.name.trim())p.name="Player "+(i+1);});

  MODE="local";stopPoll();USED={};
  G={
    players:cfg.players.map((p,i)=>({name:p.name.trim(),color:PLAYER_COLORS[i%8],score:0,streak:0,correct:0,asked:0})),
    round:0, turn:0, queue:[], roundType:null,
  };
  buildRound();
  screenRoundIntro();
}

function pick(typeKey,n){
  const pool=BANK[TYPES[typeKey].key];
  if(!USED[typeKey])USED[typeKey]=[];
  let avail=pool.map((_,i)=>i).filter(i=>!USED[typeKey].includes(i)&&!pool[i].skip);
  if(avail.length<n){USED[typeKey]=[];avail=pool.map((_,i)=>i).filter(i=>!pool[i].skip);}
  const chosen=shuffle(avail).slice(0,n);
  USED[typeKey].push(...chosen);
  return chosen.map(i=>pool[i]);
}

/* generate one round's worth of questions for any config */
function makeRoundSet(C,roundIndex,count){
  const chosen=Object.keys(TYPES).filter(k=>C.types[k]);
  const qs=[];
  if(C.themedRounds){
    const t=chosen[roundIndex%chosen.length];
    for(let i=0;i<count;i++)qs.push(makeQuestion(t));
    return {type:t,qs};
  }
  const order=[];while(order.length<count)order.push(...shuffle(chosen));
  for(let i=0;i<count;i++)qs.push(makeQuestion(order[i]));
  return {type:null,qs};
}
function buildRound(){
  const total=cfg.turnsPerPlayer*G.players.length;
  const {type,qs}=makeRoundSet(cfg,G.round,total);
  G.roundType=type;G.queue=qs;G.turn=0;
}

/* build one playable question object for a given type */
function makeQuestion(type){
  const one=k=>pick(k,1)[0];
  switch(type){
    case "trivia":{const d=one("trivia");const idx=shuffle(d.o.map((_,i)=>i));
      return {type,prompt:d.q,opts:idx.map(i=>d.o[i]),correct:idx.indexOf(d.a)};}
    case "tf":{const d=one("tf");return {type,prompt:d.q,correct:d.a,note:d.note||""};}
    case "odd":{const d=one("odd");const idx=shuffle(d.items.map((_,i)=>i));
      return {type,prompt:"Which one doesn't belong?",opts:idx.map(i=>d.items[i]),correct:idx.indexOf(d.a),why:d.why};}
    case "spells":{const set=pick("spells",4);
      return {type,prompt:"Pair each spell with what it does.",left:set.map(x=>x.s),right:shuffle(set.map(x=>x.e)),truth:Object.fromEntries(set.map(x=>[x.s,x.e]))};}
    case "scramble":{const d=one("scramble");
      let sc=shuffle(d.w.split(""));if(sc.join("")===d.w)sc=sc.reverse();
      return {type,prompt:d.h,word:d.w,tiles:sc};}
    case "whoami":{const d=one("whoami");const idx=shuffle(d.o.map((_,i)=>i));
      return {type,clues:d.clues,opts:idx.map(i=>d.o[i]),correct:idx.indexOf(d.a)};}
    case "sorting":{const set=pick("sorting",3);
      return {type,prompt:"Sort each of them.",items:set};}
    case "sequence":{const d=one("sequence");
      let sc=shuffle(d.items.map((_,i)=>i));if(sc.every((v,i)=>v===i))sc=sc.reverse();
      return {type,prompt:d.t,items:sc.map(i=>d.items[i]),truth:sc.map(i=>i)};}
  }
}

/* ═══════════════════════════════════════════════════════════════
   QUESTION RENDER
   ═══════════════════════════════════════════════════════════════ */
let timerId=null,tStart=0,tTotal=0,answered=false;
let asyncTStart=0;  // server-authoritative: track when each async question started
let asyncTimestamps=[];  // per-question start timestamps

function screenQuestion(){
  const q=G.queue[G.turn],p=activePlayer(),T=TYPES[q.type];
  answered=false;

  const dots=Array.from({length:G.queue.length},(_,i)=>
    `<span class="dot ${i<G.turn?"done":i===G.turn?"now":""}"></span>`).join("");

  app.innerHTML=`
    <div class="hud">
      <div class="who">
        <span class="eyebrow">Round ${ROMAN[G.round+1]} · ${esc(p.name)}</span>
        <h2 style="color:${p.color}">${esc(p.name)}</h2>
        <div class="score num">${p.score.toLocaleString()} pts${p.streak>1?` · streak ${p.streak}`:""}</div>
        <div class="progress-dots">${dots}</div>
      </div>
      ${cfg.timerOn?candleSVG():""}
    </div>
    <div class="card">
      <span class="q-kind">${icon(T.icon)} ${T.name}</span>
      <div id="body"></div>
    </div>
    <div id="foot"></div>`;

  RENDER[q.type](q,document.getElementById("body"));

  if(cfg.timerOn){
    tTotal=Math.round(cfg.seconds*T.time)*1000;
    tStart=performance.now();
    tick();
  }
}
function tick(){
  cancelAnimationFrame(timerId);
  const loop=()=>{
    if(answered)return;
    const frac=1-(performance.now()-tStart)/tTotal;
    setCandle(Math.max(0,frac));
    if(frac<=0){timeUp();return;}
    timerId=requestAnimationFrame(loop);
  };
  timerId=requestAnimationFrame(loop);
}
function timeUp(){
  if(answered)return;
  const q=G.queue[G.turn];
  if(FORCE[q.type])FORCE[q.type]();else resolve(0,"The candle went out.");
}
function timeLeftFrac(){
  if(!cfg.timerOn)return 0;
  return Math.max(0,Math.min(1,1-(performance.now()-tStart)/tTotal));
}

/* ═══════════════════════════════════════════════════════════════
   SCORING
   ═══════════════════════════════════════════════════════════════ */
function resolve(fraction,message,extraHTML=""){
  if(answered)return;answered=true;cancelAnimationFrame(timerId);
  const C=MODE==="local"?cfg:A.cfg;
  const p=MODE==="local"?activePlayer():A.self;
  const frac=Math.max(0,Math.min(1,fraction));
  const base=Math.round(C.basePoints*frac);
  const lines=[];
  let total=base;
  lines.push(`base &nbsp;&nbsp;&nbsp;&nbsp;+${base}`);

  if(frac>0&&C.speedBonus&&C.timerOn){
    const sp=Math.round(C.basePoints*0.5*timeLeftFrac()*frac);
    if(sp>0){total+=sp;lines.push(`speed &nbsp;&nbsp;&nbsp;+${sp}`);}
  }
  if(frac>=0.999){
    p.streak++;p.correct++;
    if(C.streakBonus&&p.streak>1){const sb=25*(p.streak-1);total+=sb;lines.push(`streak ×${p.streak} +${sb}`);}
  }else{p.streak=0;}
  p.asked++;p.score+=total;

  if(MODE==="async"){asyncVerdict(frac,total,lines,message,extraHTML);return;}

  const good=frac>=0.999,part=frac>0&&frac<0.999;
  const foot=document.getElementById("foot");
  foot.innerHTML=`
    <div class="verdict ${good?"good":part?"":"bad"}">
      <div class="between">
        <h3>${good?"Correct":part?"Partly right":"Not quite"}</h3>
        <span class="pts">+${total}</span>
      </div>
      ${message?`<p class="tiny muted" style="margin:8px 0 0">${message}</p>`:""}
      ${extraHTML}
      <div class="breakdown">${lines.join("<br>")}</div>
    </div>
    <button class="btn mt" id="next">${G.turn+1>=G.queue.length?(G.round+1>=cfg.rounds?"See the final tally":"End of round"):"Next player"}</button>`;
  document.getElementById("next").onclick=()=>{G.turn++;nextTurn();};
  foot.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ═══════════════════════════════════════════════════════════════
   RENDERERS — one per puzzle type
   ═══════════════════════════════════════════════════════════════ */
const RENDER={},FORCE={};

/* multiple choice (trivia + odd one out) */
function mcq(q,el,promptText,whyText){
  el.innerHTML=`<p class="prompt">${esc(promptText)}</p>
    <div class="opts">${q.opts.map((o,i)=>
      `<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(answered)return;
    const i=Number(b.dataset.i),ok=i===q.correct,show=showsAnswers();
    q._raw={choice:i};
    el.querySelectorAll(".opt").forEach((x,j)=>{
      if(show){
        if(j===q.correct)x.classList.add("right");
        else if(j===i)x.classList.add("wrong");
        else x.classList.add("dim");
      }else x.classList.add(j===i?"sel":"dim");
      x.style.pointerEvents="none";
    });
    resolve(ok?1:0, show&&!ok?`The answer was ${esc(q.opts[q.correct])}.${whyText?" "+esc(whyText):""}`:"");
  });
  FORCE[q.type]=()=>{
    const show=showsAnswers();
    q._raw={choice:-1};
    el.querySelectorAll(".opt").forEach((x,j)=>{x.classList.add(show&&j===q.correct?"right":"dim");x.style.pointerEvents="none";});
    resolve(0,show?`The candle went out. It was ${esc(q.opts[q.correct])}.`:"The candle went out.");
  };
}
RENDER.trivia=(q,el)=>mcq(q,el,q.prompt);
RENDER.odd=(q,el)=>mcq(q,el,q.prompt,q.why);

/* true / false */
RENDER.tf=(q,el)=>{
  el.innerHTML=`<p class="prompt">${esc(q.prompt)}</p>
    <div class="tf">
      <button class="opt" data-v="true">True</button>
      <button class="opt" data-v="false">False</button>
    </div>`;
  const done=(pick)=>{
    const show=showsAnswers();
    q._raw={value:pick};
    el.querySelectorAll(".opt").forEach(x=>{
      const v=x.dataset.v==="true";
      if(show){if(v===q.correct)x.classList.add("right");else if(v===pick)x.classList.add("wrong");else x.classList.add("dim");}
      else x.classList.add(v===pick?"sel":"dim");
      x.style.pointerEvents="none";
    });
    const ok=pick===q.correct;
    resolve(ok?1:0, !show?"":ok?(q.note?esc(q.note):""):`It's ${q.correct?"true":"false"}.${q.note?" "+esc(q.note):""}`);
  };
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(!answered)done(b.dataset.v==="true");});
  FORCE.tf=()=>done(null);
};

/* spell match */
RENDER.spells=(q,el)=>{
  let sel=null,pairs={};
  el.innerHTML=`<p class="prompt">${esc(q.prompt)}</p>
    <div class="match">
      <div class="match-col">${q.left.map((s,i)=>`<button class="mi" data-side="l" data-i="${i}"><span class="tag" style="visibility:hidden">1</span><span class="spell">${esc(s)}</span></button>`).join("")}</div>
      <div class="match-col">${q.right.map((e,i)=>`<button class="mi" data-side="r" data-i="${i}"><span class="tag" style="visibility:hidden">1</span><span>${esc(e)}</span></button>`).join("")}</div>
    </div>
    <button class="btn mt" id="submitMatch" disabled>Cast them all</button>`;

  const btn=el.querySelector("#submitMatch");
  const nodes=[...el.querySelectorAll(".mi")];
  const paint=()=>{
    nodes.forEach(n=>{
      const key=n.dataset.side+n.dataset.i;
      const idx=pairs[key];
      const tag=n.querySelector(".tag");
      n.classList.toggle("paired",idx!==undefined);
      n.classList.toggle("sel",sel===key);
      tag.style.visibility=idx!==undefined?"visible":"hidden";
      tag.textContent=idx!==undefined?idx:"";
    });
    btn.disabled=Object.keys(pairs).length<q.left.length*2;
  };
  let counter=0;
  nodes.forEach(n=>n.onclick=()=>{
    if(answered)return;
    const key=n.dataset.side+n.dataset.i;
    if(pairs[key]!==undefined){                       // unpair
      const num=pairs[key];
      Object.keys(pairs).forEach(k=>{if(pairs[k]===num)delete pairs[k];});
      sel=null;paint();return;
    }
    if(!sel){sel=key;paint();return;}
    if(sel[0]===key[0]){sel=key;paint();return;}      // same column → move selection
    counter++;pairs[sel]=counter;pairs[key]=counter;sel=null;paint();
  });

  const grade=()=>{
    let right=0;
    const byNum={};
    Object.entries(pairs).forEach(([k,n])=>{(byNum[n]=byNum[n]||[]).push(k);});
    const map={};
    Object.values(byNum).forEach(arr=>{
      if(arr.length!==2)return;
      const l=arr.find(x=>x[0]==="l"),r=arr.find(x=>x[0]==="r");
      if(l&&r)map[q.left[+l.slice(1)]]=q.right[+r.slice(1)];
    });
    q._raw={pairs:Object.entries(map)};
    const show=showsAnswers();
    q.left.forEach((s,i)=>{
      const ok=map[s]===q.truth[s];
      if(ok)right++;
      if(show){const ln=nodes.find(n=>n.dataset.side==="l"&&+n.dataset.i===i);ln.classList.add(ok?"right":"wrong");}
    });
    nodes.forEach(n=>n.style.pointerEvents="none");
    btn.style.display="none";
    if(!show){resolve(right/q.left.length,"");return;}
    const key=q.left.map(s=>`<b style="color:var(--candle)">${esc(s)}</b> — ${esc(q.truth[s])}`).join("<br>");
    resolve(right/q.left.length,`${right} of ${q.left.length} pairs correct.`,
      `<p class="tiny muted" style="margin:10px 0 0;line-height:1.7">${key}</p>`);
  };
  btn.onclick=()=>{if(!answered)grade();};
  FORCE.spells=grade;
  paint();
};

/* unscramble */
RENDER.scramble=(q,el)=>{
  el.innerHTML=`<span class="eyebrow">Unscramble</span>
    <p class="prompt" style="margin-top:8px">${esc(q.prompt)}</p>
    <div class="scramble">${q.tiles.map(c=>`<span class="tile">${c}</span>`).join("")}</div>
    <input class="answer-input mt" id="ans" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${"·".repeat(q.word.length)}" aria-label="Your answer">
    <button class="btn mt-s" id="sub">Submit</button>`;
  const inp=el.querySelector("#ans");
  const grade=()=>{
    if(answered)return;
    q._raw={word:inp.value};
    const ok=norm(inp.value)===norm(q.word),show=showsAnswers();
    if(show)inp.style.borderColor=ok?"var(--moss)":"var(--ember)";
    inp.disabled=true;el.querySelector("#sub").style.display="none";
    resolve(ok?1:0, !show||ok?"":`The word was <b style="color:var(--candle)">${esc(q.word)}</b>.`);
  };
  el.querySelector("#sub").onclick=grade;
  inp.onkeydown=e=>{if(e.key==="Enter")grade();};
  FORCE.scramble=()=>{inp.disabled=true;el.querySelector("#sub").style.display="none";
    resolve(0,showsAnswers()?`The candle went out. The word was <b style="color:var(--candle)">${esc(q.word)}</b>.`:"The candle went out.");};
  setTimeout(()=>inp.focus(),80);
};

/* who am I — clue ladder */
RENDER.whoami=(q,el)=>{
  let shown=1;
  const mult=[1,.7,.45];
  const draw=()=>{
    el.innerHTML=`<span class="eyebrow">Who am I?</span>
      ${q.clues.slice(0,shown).map((c,i)=>`<div class="clue"><span class="cn">Clue ${i+1}</span>${esc(c)}</div>`).join("")}
      <div class="between mt">
        <span class="worth">Worth ${Math.round(cfg.basePoints*mult[shown-1])} pts</span>
        ${shown<q.clues.length?`<button class="btn quiet" style="width:auto;padding:9px 14px" id="more">Next clue (−${Math.round(cfg.basePoints*(mult[shown-1]-mult[shown]))})</button>`:`<span class="tiny muted">No clues left</span>`}
      </div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    const m=el.querySelector("#more");
    if(m)m.onclick=()=>{shown++;draw();};
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(answered)return;
      const i=Number(b.dataset.i),ok=i===q.correct,show=showsAnswers();
      q._raw={choice:i,clueIndex:shown-1};
      el.querySelectorAll(".opt").forEach((x,j)=>{
        if(show){if(j===q.correct)x.classList.add("right");else if(j===i)x.classList.add("wrong");else x.classList.add("dim");}
        else x.classList.add(j===i?"sel":"dim");
        x.style.pointerEvents="none";});
      if(m)m.style.display="none";
      resolve(ok?mult[shown-1]:0, !show?`Answered on clue ${shown}.`:ok?`Solved on clue ${shown}.`:`It was ${esc(q.opts[q.correct])}.`);
    });
  };
  draw();
  FORCE.whoami=()=>{
    const show=showsAnswers();
    el.querySelectorAll(".opt").forEach((x,j)=>{x.classList.add(show&&j===q.correct?"right":"dim");x.style.pointerEvents="none";});
    resolve(0,show?`The candle went out. It was ${esc(q.opts[q.correct])}.`:"The candle went out.");
  };
};

/* sorting hat */
RENDER.sorting=(q,el)=>{
  let idx=0,right=0;
  const answers=[];
  const draw=()=>{
    const it=q.items[idx];
    el.innerHTML=`<div class="between"><span class="eyebrow">Sort them</span><span class="tiny muted num">${idx+1} / ${q.items.length}</span></div>
      <p class="prompt">${esc(it.n)}</p>
      <div class="houses">${HOUSES.map(h=>`<button class="house" data-h="${h}">${h}<span class="hs">${HOUSE_SUB[h]}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".house").forEach(b=>b.onclick=()=>{
      if(answered)return;
      const ok=b.dataset.h===it.h;if(ok)right++;
      answers.push(b.dataset.h);
      const show=showsAnswers();
      el.querySelectorAll(".house").forEach(x=>{
        if(show){if(x.dataset.h===it.h)x.classList.add("right");else if(x===b)x.classList.add("wrong");}
        else if(x===b)x.classList.add("sel");
        x.style.pointerEvents="none";});
      setTimeout(()=>{idx++;idx<q.items.length?draw():finish();},show?650:280);
    });
  };
  const finish=(timedOut)=>{
    q._raw={order:answers};
    if(!showsAnswers()){resolve(right/q.items.length,"");return;}
    const key=q.items.map(i=>`<b style="color:var(--candle)">${esc(i.n)}</b> — ${i.h}`).join("<br>");
    resolve(right/q.items.length,timedOut?"The candle went out.":`${right} of ${q.items.length} sorted correctly.`,
      `<p class="tiny muted" style="margin:10px 0 0;line-height:1.7">${key}</p>`);
  };
  draw();
  FORCE.sorting=()=>{q._raw={order:answers};finish(true);};
};

/* put in order */
RENDER.sequence=(q,el)=>{
  const order=[];
  el.innerHTML=`<p class="prompt">${esc(q.prompt)}</p>
    <p class="tiny muted mt-s">Tap them in the right order.</p>
    <div class="seq-pool">${q.items.map((t,i)=>
      `<button class="seq-item" data-i="${i}"><span class="ord">·</span><span>${esc(t)}</span></button>`).join("")}</div>
    <button class="btn mt-s quiet" id="undo">Undo last</button>`;
  const nodes=[...el.querySelectorAll(".seq-item")];
  const paint=()=>nodes.forEach((n,i)=>{
    const pos=order.indexOf(i);
    n.classList.toggle("picked",pos>=0);
    n.querySelector(".ord").textContent=pos>=0?pos+1:"·";
  });
  const grade=()=>{
    q._raw={order:order.slice()};
    let right=0;const show=showsAnswers();
    order.forEach((itemIdx,pos)=>{if(q.truth[itemIdx]===pos)right++;});
    nodes.forEach((n,i)=>{
      const pos=order.indexOf(i);
      if(show)n.classList.add(pos>=0&&q.truth[i]===pos?"right":"wrong");
      n.style.pointerEvents="none";
    });
    el.querySelector("#undo").style.display="none";
    if(!show){resolve(right/q.items.length,"");return;}
    const truthList=q.items.map((t,i)=>({t,p:q.truth[i]})).sort((a,b)=>a.p-b.p)
      .map((x,i)=>`${i+1}. ${esc(x.t)}`).join("<br>");
    resolve(right/q.items.length,`${right} of ${q.items.length} in the right place.`,
      `<p class="tiny muted" style="margin:10px 0 0;line-height:1.7">${truthList}</p>`);
  };
  nodes.forEach(n=>n.onclick=()=>{
    if(answered||order.includes(+n.dataset.i))return;
    order.push(+n.dataset.i);paint();
    if(order.length===q.items.length)setTimeout(grade,300);
  });
  el.querySelector("#undo").onclick=()=>{if(!answered){order.pop();paint();}};
  FORCE.sequence=grade;
};

function answerText(q){
  switch(q.type){
    case "trivia":case "odd":case "whoami":return q.opts[q.correct];
    case "tf":return q.correct?"True":"False";
    case "scramble":return q.word;
    case "spells":return q.left.map(s=>`${s} — ${q.truth[s]}`).join(" · ");
    case "sorting":return q.items.map(i=>`${i.n} — ${i.h}`).join(" · ");
    case "sequence":return q.items.map((t,i)=>({t,p:q.truth[i]})).sort((a,b)=>a.p-b.p).map((x,i)=>`${i+1}. ${x.t}`).join(" · ");
  }
  return "";
}
function questionText(q){
  if(q.type==="whoami")return "Who am I? — "+q.clues[0];
  if(q.type==="scramble")return "Unscramble: "+q.prompt;
  return q.prompt;
}

  document.getElementById("join").onclick=go;
  inp.onkeydown=e=>{if(e.key==="Enter")go();};
  setTimeout(()=>inp.focus(),80);
}

/* ── host creates via server ── */
async function hostCreate(){
  const err=document.getElementById("err");
  if(!Object.keys(TYPES).some(k=>cfg.types[k])){err.textContent="Choose at least one puzzle type.";return;}
  err.textContent="Lighting the candle…";
  const res=await gameAPI("create",{hostId:ME.id,hostName:ME.name.trim(),cfg:{
    types:{...cfg.types},rounds:cfg.rounds,turnsPerPlayer:cfg.turnsPerPlayer,basePoints:cfg.basePoints,
    timerOn:cfg.timerOn,seconds:cfg.seconds,speedBonus:cfg.speedBonus,streakBonus:cfg.streakBonus,
    themedRounds:cfg.themedRounds,hideAnswers:cfg.hideAnswers
  }});
  if(res.error){err.textContent=res.error;return;}
  ME.code=res.code;await saveMe();
  await enterGame(res.code);
}

/* ── load from server + route ── */
async function loadGame(code){
  const res=await gameAPI("state",{code});
  if(res.error||!res.game)return null;
  const game=res.game;
  const players=Object.values(game.players||{}).sort((a,b)=>(a.joined||0)-(b.joined||0));
  return {game,players};
}
function setCtx(game,players){
  MODE="async";
  const mine=players.find(p=>p.id===ME.id)||{id:ME.id,name:ME.name,color:PLAYER_COLORS[0],score:0,streak:0,answers:{}};
  A={code:game.code,game,cfg:game.cfg,isHost:game.host===ME.id,me:mine,players,
     round:game.round,hide:!!game.cfg.hideAnswers,qs:A&&A.qs,idx:A&&A.idx,results:A&&A.results,self:A&&A.self};
}
let lastSig="";
function stateSig(game,players){
  return [game.status,game.round,Object.keys(game.revealed||{}).join("")].concat(
    players.map(p=>`${p.id}|${p.name}|${(p.answers||{})[game.round]?.done?"d":0}`)).join("~");
}
async function enterGame(code){
  stopPoll();
  A=null;                       // drop any previous game, or syncAndRoute follows the stale code
  if(ME)ME.code=code;
  lastSig="";
  app.innerHTML=`<div class="pass"><span class="pill-live">Connecting</span><p class="serif-i mt">Finding the game…</p></div>`;
  await syncAndRoute();
}
async function syncAndRoute(){
  const code=(A&&A.code)||(ME&&ME.code);
  if(!code){screenHome();return;}
  LAST_ERR="";
  let g=await loadGame(code);
  if(!g)await new Promise(r=>setTimeout(r,900));
  if(!g)g=await loadGame(code);
  if(!g){stopPoll();screenTrouble(code);return;}
  const s=stateSig(g.game,g.players);
  const changed=s!==lastSig;lastSig=s;
  setCtx(g.game,g.players);
  const m=g.game,r=m.round;

  if(m.status==="done"){stopPoll();renderFinal();return;}
  if(m.status==="lobby"){if(changed||!document.getElementById("lobbyRoot"))renderLobby();return;}
  if((m.revealed||{})[r]){if(changed||!document.getElementById("revealRoot"))renderReveal(r);return;}
  const myAns=(A.me.answers||{})[r];
  if(myAns&&myAns.done){if(changed||!document.getElementById("waitRoot"))renderWaiting();return;}
  stopPoll();startRoundPlay(r);
}
function leaveButton(){return `<button class="btn quiet mt" id="leave">Leave this game</button>`;}
function wireLeave(){
  const b=document.getElementById("leave");if(!b)return;
  b.onclick=async()=>{stopPoll();ME.code=null;await saveMe();screenHome();};
}

function screenTrouble(code){
  stopPoll();
  app.innerHTML=`
    <div class="center" style="padding:40px 0 4px">
      <span class="eyebrow">Couldn't reach the game</span>
      <h2 style="margin-top:8px">${esc(code||"—")}</h2>
      <p class="serif-i" style="margin-top:10px">The server didn't respond. This is usually a temporary hiccup.</p>
    </div>
    <p class="tiny muted center mt">${LAST_ERR?`<span class="num" style="font-size:.72rem">${esc(LAST_ERR)}</span>`:""}</p>
    <button class="btn mt" id="retry">Try again</button>
    <button class="btn ghost mt-s" id="quit">Leave this game</button>`;
  document.getElementById("retry").onclick=()=>{lastSig="";syncAndRoute();};
  document.getElementById("quit").onclick=async()=>{ME.code=null;await saveMe();screenHome();};
}

/* ── host controls (server-authoritative) ── */
async function hostStart(){
  const res=await gameAPI("start",{code:A.code,hostId:ME.id});
  if(res.error){toast(res.error);return;}
  lastSig="";await syncAndRoute();
}
async function hostCloseRound(){
  const res=await gameAPI("reveal",{code:A.code,hostId:ME.id,round:A.game.round});
  if(res.error){toast(res.error);return;}
  lastSig="";await syncAndRoute();
}
async function hostNextRound(){
  const res=await gameAPI("next",{code:A.code,hostId:ME.id});
  if(res.error){toast(res.error);return;}
  lastSig="";await syncAndRoute();
}

/* ── playing a round ── */
function startRoundPlay(r){
  const qs=(A.game.questions||{})[r];
  if(!qs||!qs.length){
    app.innerHTML=`<div class="pass" id="waitRoot"><span class="pill-live">Waiting</span>
      <p class="serif-i mt">Round ${ROMAN[r+1]} is being set out…</p>${leaveButton()}</div>`;
    wireLeave();poll(syncAndRoute);return;
  }
  const prior=(A.me.answers||{})[r];
  A.round=r;A.qs=qs;
  A.results=(prior&&prior.results)?prior.results.slice():[];
  A.idx=A.results.length;
  asyncTimestamps=[];
  A.self={score:prior?(prior.score||0):0,streak:prior?(prior.streak||0):0,correct:0,asked:0};
  if(A.idx>=qs.length){submitRound();return;}
  screenAsyncQuestion();
}
function screenAsyncQuestion(){
  const q=A.qs[A.idx],T=TYPES[q.type];
  answered=false;
  const dots=A.qs.map((_,i)=>`<span class="dot ${i<A.idx?"done":i===A.idx?"now":""}"></span>`).join("");
  app.innerHTML=`
    <div class="hud">
      <div class="who">
        <span class="eyebrow">Round ${ROMAN[A.round+1]} of ${ROMAN[A.cfg.rounds]} · question ${A.idx+1}/${A.qs.length}</span>
        <h2 style="color:${A.me.color}">${esc(A.me.name)}</h2>
        <div class="score num">${A.hide?"Sealed round":A.self.score.toLocaleString()+" pts this round"}</div>
        <div class="progress-dots">${dots}</div>
      </div>
      ${A.cfg.timerOn?candleSVG():""}
    </div>
    <div class="card">
      <span class="q-kind">${icon(T.icon)} ${T.name}</span>
      <div id="body"></div>
    </div>
    <div id="foot"></div>`;
  RENDER[q.type](q,document.getElementById("body"));
  asyncTStart=Date.now();
  asyncTimestamps[A.idx]=asyncTStart;
  if(A.cfg.timerOn){tTotal=Math.round(A.cfg.seconds*T.time)*1000;tStart=performance.now();tick();}
}
async function asyncVerdict(frac,total,lines,message,extraHTML){
  A.results.push({f:frac,p:total});
  const last=A.idx+1>=A.qs.length;
  const foot=document.getElementById("foot");
  foot.innerHTML=A.hide
    ? `<div class="verdict">
         <div class="between"><h3>Answer locked</h3><span class="pts">✓</span></div>
         <p class="tiny muted" style="margin:8px 0 0">Nobody sees this until the host closes the round.</p>
       </div>
       <button class="btn mt" id="next">${last?"Submit my round":"Next question"}</button>`
    : `<div class="verdict ${frac>=.999?"good":frac>0?"":"bad"}">
         <div class="between"><h3>${frac>=.999?"Correct":frac>0?"Partly right":"Not quite"}</h3><span class="pts">+${total}</span></div>
         ${message?`<p class="tiny muted" style="margin:8px 0 0">${message}</p>`:""}${extraHTML}
         <div class="breakdown">${lines.join("<br>")}</div>
       </div>
       <button class="btn mt" id="next">${last?"Submit my round":"Next question"}</button>`;
  const btn=document.getElementById("next");
  btn.onclick=async()=>{
    btn.disabled=true;
    if(last){await submitRound();}
    else{A.idx++;screenAsyncQuestion();}
  };
  foot.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function submitRound(){
  app.innerHTML=`<div class="pass"><span class="pill-live">Sending</span><p class="serif-i mt">Sealing your answers…</p></div>`;
  // Collect raw answers from each question with actual elapsed times
  const rawAnswers=A.qs.map((q,i)=>{
    const qStart=asyncTimestamps[i]||asyncTStart;
    return {
      answer:q._raw||null,
      elapsedMs:A.results[i]?Date.now()-qStart:null
    };
  });
  const res=await gameAPI("submit",{code:A.code,playerId:ME.id,round:A.round,answers:rawAnswers});
  if(res.error){toast("Submit failed: "+res.error);}
  lastSig="";
  await syncAndRoute();
}

/* ── waiting room ── */
function renderWaiting(){
  const m=A.game,r=m.round,ps=A.players;
  const inCount=ps.filter(p=>(p.answers||{})[r]?.done).length;
  const allIn=inCount===ps.length;
  app.innerHTML=`
    <div id="waitRoot">
      <div class="between" style="padding:14px 0 2px">
        <span class="eyebrow">Round ${ROMAN[r+1]} · your answers are in</span><span class="pill-live">Live</span>
      </div>
      <div class="center" style="padding:22px 0 2px">
        <h2>${allIn?"Everyone's in":`${inCount} of ${ps.length} finished`}</h2>
        <p class="serif-i" style="margin-top:8px">${A.isHost?(allIn?"Close the round whenever you're ready.":"You can wait, or close the round without them."):(allIn?"The host will close the round shortly.":"Nudge the stragglers.")}</p>
      </div>

      <div class="card mt">
        <span class="eyebrow">Who's answered</span>
        <div class="stack mt-s">${ps.map(p=>{
          const done=(p.answers||{})[r]?.done;
          const n=((m.questions||{})[r]||[]).length||1;
          return `<div class="wait-row ${done?"in":""}">
            <span class="pip" style="color:${p.color};background:${p.color}"></span>
            <span class="nm">${esc(p.name)}${p.id===ME.id?" (you)":""}</span>
            ${done?`<span class="st">done</span>`
                  :`<span class="st">waiting</span>`}
          </div>`;}).join("")}</div>
        <p class="hint">${m.cfg.hideAnswers?"Scores stay sealed until the round closes.":"Running totals appear when the round closes."}</p>
      </div>

      ${A.isHost
        ? `<button class="btn mt" id="close">Close round ${ROMAN[r+1]}${allIn?"":" without them"}</button>
           ${allIn?"":`<p class="tiny muted center mt-s">Anyone who hasn't answered scores nothing for this round.</p>`}`
        : `<div class="card mt center"><span class="pill-live">Waiting</span>
            <p class="serif-i" style="margin-top:10px">${esc(ps.find(p=>p.id===m.host)?.name||"The host")} closes the round.</p></div>`}
      ${leaveButton()}
    </div>`;
  if(A.isHost)document.getElementById("close").onclick=hostCloseRound;
  wireLeave();
  poll(syncAndRoute);
}

/* ── round reveal ── */
function renderReveal(r){
  const m=A.game,ps=A.players,qs=(m.questions||{})[r]||[];
  const mine=(A.me.answers||{})[r];
  const table=ps.map(p=>{
    const roundAns=(p.answers||{})[r];
    return {...p,total:Object.values(p.answers||{}).reduce((s,a)=>s+(a?.score||0),0),
      thisRound:roundAns?.score||0,played:!!roundAns?.done};
  }).sort((a,b)=>b.total-a.total);
  const last=r+1>=m.cfg.rounds;
  app.innerHTML=`
    <div id="revealRoot">
      <div class="center" style="padding:26px 0 4px">
        <span class="eyebrow">Round ${ROMAN[r+1]} · closed</span>
        <h2 style="margin-top:6px">${mine?`You scored ${(mine.score||0).toLocaleString()}`:"You sat this one out"}</h2>
      </div>

      <div class="card mt">
        <span class="eyebrow">Standings</span>
        <div class="stack mt-s">${table.map((p,i)=>`
          <div class="sb-row ${i===0?"lead":""}">
            <span class="rank num">${i+1}</span>
            <span class="pip" style="color:${p.color};background:${p.color}"></span>
            <span class="nm">${esc(p.name)}${p.id===ME.id?" (you)":""}</span>
            <span class="pt">${p.total.toLocaleString()}<span class="tiny muted" style="display:block;text-align:right">${p.played?`+${p.thisRound.toLocaleString()}`:"missed"}</span></span>
          </div>`).join("")}</div>
      </div>

      <div class="card">
        <span class="eyebrow">The answers</span>
        <div style="margin-top:4px">${qs.map((q,i)=>{
          const res=mine&&mine.results&&mine.results[i];
          const hit=res&&res.f>=0.999,part=res&&res.f>0&&res.f<0.999;
          return `<div class="rev-q">
            <div class="qq">${i+1}. ${esc(questionText(q))}</div>
            <div class="aa">${esc(answerText(q))}</div>
            <div class="yy ${hit?"hit":part?"hit":"miss"}">${res?`you scored ${res.p} pt${res.p===1?"":"s"}`:"no answer"}</div>
          </div>`;}).join("")}</div>
      </div>

      ${A.isHost
        ? `<button class="btn mt" id="on">${last?"Finish and show the winner":`Start round ${ROMAN[r+2]}`}</button>`
        : `<div class="card mt center"><span class="pill-live">Waiting</span>
            <p class="serif-i" style="margin-top:10px">${last?"The host will close the game.":`${esc(ps.find(p=>p.id===m.host)?.name||"The host")} will start round ${ROMAN[r+2]}.`}</p></div>`}
      ${leaveButton()}
    </div>`;
  if(A.isHost)document.getElementById("on").onclick=hostNextRound;
  wireLeave();
  poll(syncAndRoute);
}

      <div class="stack mt-s">${ps.map((p,i)=>`
        <div class="sb-row ${i===0?"lead":""}">
          <span class="rank num">${i+1}</span>
          <span class="pip" style="color:${p.color};background:${p.color}"></span>

          <span class="pt">${p.total.toLocaleString()}</span>
        </div>`).join("")}</div>
    </div>
    <button class="btn mt" id="home">Back to the start</button>`;
  document.getElementById("home").onclick=async()=>{ME.code=null;await saveMe();screenHome();};
}

/* ── boot ── */
async function boot(){
  // Show animated splash
  app.innerHTML=`
    <div class="splash" id="splash">
      <div class="candle-icon">🕯️</div>
      <div class="logo">CandleLight</div>
      <div class="credit">by MrKnowItAll</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>`;

  // Check server in background while splash plays
  const probePromise=probeBackends();

  // Wait at least 2s so splash animation plays
  await new Promise(r=>setTimeout(r,2200));
  await probePromise;

  // Fade out splash
  const splash=document.getElementById("splash");
  if(splash){splash.classList.add("splash-out");await new Promise(r=>setTimeout(r,450));}

  // Load identity
  const saved=lsGet(kMe);
  ME=saved&&saved.id?{id:saved.id,name:saved.name||"",code:saved.code||null}:{id:uid(),name:"",code:null};

  // Auto-join from URL ?code=
  const params=new URLSearchParams(location.search);
  const urlCode=params.get("code");
  if(urlCode&&urlCode.trim()){
    const code=urlCode.trim().toUpperCase();
    // Clear the URL param so refresh doesn't re-join
    history.replaceState(null,"",location.pathname);
    // If already in this game, just enter
    if(ME.code===code){await enterGame(code);return;}
    // Otherwise, go to join screen (name entry) — user will tap Join
    ME.code=null;
    await saveMe();
    screenJoin(code);
    return;
  }

  // If user was in an existing game, re-enter it
  if(ME.code){
    const res=await gameAPI("state",{code:ME.code});
    if(!res.error&&res.game&&res.game.status!=="done"){await enterGame(ME.code);return;}
    ME.code=null;
  }
  screenHome();
}
boot();
